<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Pokémon Helper">
  <title>Pokémon Helper</title>
  <!-- Full-bleed hero-blue plate so the mark holds up against both light and
       dark browser chrome. Geometry is simplified relative to logo.svg: the
       inner ring is dropped and weights are heavier, because the fine detail
       in the full logo turns to mud below ~24px. -->
  <rect width="64" height="64" fill="#285f8f" />
  <g fill="none" stroke="#fffefa" stroke-width="7">
    <circle cx="32" cy="32" r="22" />
    <path d="M10 32H54" />
  </g>
  <circle cx="32" cy="32" r="9" fill="#ef715d" stroke="#fffefa" stroke-width="5" />
</svg>
